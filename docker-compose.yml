services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_DB: ${DB_NAME:-football_verse}
      POSTGRES_USER: ${DB_USERNAME:-football_verse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-football_verse}
      INGESTION_DB_NAME: ${INGESTION_DB_NAME:-ingestion_db}
      INGESTION_DB_USER: ${INGESTION_DB_USER:-ingestion_user}
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD:-ingestion_pass}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54320}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init/10-ingestion-database.sh:/docker-entrypoint-initdb.d/10-ingestion-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  prediction-service:
    build: ./services/prediction
    environment:
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY:-}
      FOOTBALL_PROVIDER: ${FOOTBALL_PROVIDER:-football-data}
      FOOTBALL_SEASON: ${FOOTBALL_SEASON:-2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99

  core-service:
    build: ./services/core-api
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-football_verse}
      - DB_USERNAME=${DB_USERNAME:-football_verse}
      - DB_PASSWORD=${DB_PASSWORD:-football_verse}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - PREDICTION_SERVICE_URL=http://prediction-service:8090
      - MINIGAME_SPORTSDB_KEY=${MINIGAME_SPORTSDB_KEY:-123}
      - MINIGAME_SPORTSDB_BASE_URL=${MINIGAME_SPORTSDB_BASE_URL:-https://www.thesportsdb.com/api/v1/json}
      - MINIGAME_ESPN_BASE_URL=${MINIGAME_ESPN_BASE_URL:-https://site.api.espn.com/apis/site/v2/sports/soccer}
      - APP_GATEWAY_URL=${APP_GATEWAY_URL:-http://localhost:3000}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost:3000}
      - APP_CONTENT_INGESTION_URL=http://content-ingestion:8085
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me-dev-secret-change-me}
      - JWT_ISSUER=${JWT_ISSUER:-football-verse-core}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-football-verse-api}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - APP_MAIL_ENABLED=${APP_MAIL_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_APP_PASSWORD=${SMTP_APP_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-1footballverse@gmail.com}
      - APP_MAIL_ENCRYPTION_KEY=${APP_MAIL_ENCRYPTION_KEY:-}
      - APP_AUTH_RATE_LIMIT_SECRET=${APP_AUTH_RATE_LIMIT_SECRET:-}
      - APP_TRUSTED_PROXIES=${APP_TRUSTED_PROXIES:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - APP_SEED_ENABLED=${APP_SEED_ENABLED:-false}
      - APP_CLUSTERING_MODE=${APP_CLUSTERING_MODE:-vector}
      - APP_ENV=${APP_ENV:-development}
      - BILLING_ENABLED=${BILLING_ENABLED:-false}
      - BILLING_SALES_ENABLED=${BILLING_SALES_ENABLED:-false}
      - BILLING_EXPIRY_POLL_MS=${BILLING_EXPIRY_POLL_MS:-300000}
      - SEPAY_ENV=${SEPAY_ENV:-sandbox}
      - SEPAY_MERCHANT_ID=${SEPAY_MERCHANT_ID:-}
      - SEPAY_SECRET_KEY=${SEPAY_SECRET_KEY:-}
      - SEPAY_IPN_SECRET=${SEPAY_IPN_SECRET:-}
      - SEPAY_CHECKOUT_URL=${SEPAY_CHECKOUT_URL:-https://pay-sandbox.sepay.vn/v1/checkout/init}
      - SEPAY_API_URL=${SEPAY_API_URL:-https://pgapi-sandbox.sepay.vn}
      - SEPAY_BANKHUB_API_KEY=${SEPAY_BANKHUB_API_KEY:-}
      - SEPAY_QR_BANK_CODE=${SEPAY_QR_BANK_CODE:-}
      - SEPAY_QR_ACCOUNT_NUMBER=${SEPAY_QR_ACCOUNT_NUMBER:-}
      - SEPAY_QR_ACCOUNT_NAME=${SEPAY_QR_ACCOUNT_NAME:-}
      - SEPAY_QR_TEMPLATE=${SEPAY_QR_TEMPLATE:-compact}
      - PREMIUM_1_MONTH_PRICE_VND=${PREMIUM_1_MONTH_PRICE_VND:-49000}
      - PREMIUM_3_MONTH_PRICE_VND=${PREMIUM_3_MONTH_PRICE_VND:-129000}
      - PREMIUM_6_MONTH_PRICE_VND=${PREMIUM_6_MONTH_PRICE_VND:-219000}
      - PREMIUM_12_MONTH_PRICE_VND=${PREMIUM_12_MONTH_PRICE_VND:-349000}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_COOKIE_SAME_SITE=${AUTH_COOKIE_SAME_SITE:-Lax}
      - APP_UPLOAD_DIR=/app/uploads
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - AI_DAILY_LIMIT=${AI_DAILY_LIMIT:-20}
      - AI_OUTBOX_POLL_MS=${AI_OUTBOX_POLL_MS:-5000}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_INSTANT_BREAKING_ENABLED=${TELEGRAM_INSTANT_BREAKING_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID:-}
    volumes:
      - core_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  gateway-service:
    build: ./services/gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - BACKEND_URL=http://core-service:8080
      - PREDICTION_SERVICE_URL=http://prediction-service:8090
      - CONTENT_INGESTION_URL=http://content-ingestion:8085
      - REDIS_URL=redis://redis:6379
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me-dev-secret-change-me}
      - JWT_ISSUER=${JWT_ISSUER:-football-verse-core}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-football-verse-api}
      - APP_ENV=${APP_ENV:-development}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-300}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - BILLING_IPN_RATE_LIMIT_MAX=${BILLING_IPN_RATE_LIMIT_MAX:-60}
    depends_on:
      - redis
      - prediction-service
      - core-service

  content-ingestion:
    build: ./services/content-ingestion
    environment:
      - BACKEND_URL=http://core-service:8080
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      - INGESTION_DB_URL=postgresql://${INGESTION_DB_USER:-ingestion_user}:${INGESTION_DB_PASSWORD:-ingestion_pass}@postgres:5432/${INGESTION_DB_NAME:-ingestion_db}
      - CRAWL_CRON=${CRAWL_CRON:-*/15 * * * *}
      - REDDIT_ACCESS_TOKEN=${REDDIT_ACCESS_TOKEN:-}
      - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN:-}
      - YOUTUBE_DATA_API_KEY=${YOUTUBE_DATA_API_KEY:-}
      - CORE_IMPORT_TIMEOUT_MS=${CORE_IMPORT_TIMEOUT_MS:-30000}
      - INGESTION_MODE=${INGESTION_MODE:-rss_metadata_publish}
      - RUN_CRAWL_ON_STARTUP=${RUN_CRAWL_ON_STARTUP:-false}
      - PORT=8085
    expose:
      - "8085"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8085/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      core-service:
        condition: service_started

  web-client:
    build:
      context: ./apps/web
      args:
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - gateway-service

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: ["http", "gateway-service:8000"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - gateway-service
    ports:
      - "${NGROK_INSPECTOR_PORT:-4040}:4040"

volumes:
  postgres_data:
  core_uploads:
