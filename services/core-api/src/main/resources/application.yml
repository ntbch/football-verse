spring:
  application:
    name: football-verse-api
  cache:
    type: simple
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/football_verse}
    username: ${DB_USERNAME:football_verse}
    password: ${DB_PASSWORD:football_verse}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:127.0.0.1}
      port: ${SPRING_REDIS_PORT:6379}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    ignore-migration-patterns: "*:missing,*:future"

app:
  environment: ${APP_ENV:development}
  cors-origin: ${CORS_ORIGIN:http://localhost:3000}
  internal:
    token: ${INTERNAL_TOKEN}
  gateway:
    url: ${APP_GATEWAY_URL:http://localhost:3000}
  content-ingestion:
    url: ${APP_CONTENT_INGESTION_URL:http://localhost:8085}
  clustering:
    mode: ${APP_CLUSTERING_MODE:vector-shadow}
    window-hours: 48
    candidate-limit: 20
    semantic-weight: 0.75
    lexical-weight: 0.10
    entity-weight: 0.10
    time-weight: 0.05
    auto-merge-threshold: 0.25
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    admin-password: ${APP_ADMIN_PASSWORD:}
    moderator-password: ${APP_MODERATOR_PASSWORD:}
    news-categories: ${APP_SEED_NEWS_CATEGORIES:League News=league-tournament-news;Match Analysis=match-preview-analysis;Transfers=transfer-news;Off the Pitch=off-the-pitch;Opinions=expert-fan-opinions;Football Facts=football-facts-tactical-insights;Others=others}
    forum-categories: ${APP_SEED_FORUM_CATEGORIES:League News=league-tournament-news;Match Analysis=match-preview-analysis;Transfers=transfer-news;Off the Pitch=off-the-pitch;Opinions=expert-fan-opinions;Football Facts=football-facts-tactical-insights;Others=others}
    news-sources: ${APP_SEED_NEWS_SOURCES:ESPN Soccer=https://www.espn.com/espn/rss/soccer/news;BBC Sport Football=https://feeds.bbci.co.uk/sport/football/rss.xml;Transfermarkt=https://www.transfermarkt.co.uk/rss/news;Tribuna.com=https://tribuna.com/rss/news;The Guardian Football=https://www.theguardian.com/football/rss;Mirror Football=https://www.mirror.co.uk/sport/football/rss.xml;The Athletic Football=https://www.nytimes.com/athletic/rss/football/;Daily Mail Football=https://www.dailymail.co.uk/sport/football/index.rss}
  crawl:
    startup-enabled: ${APP_CRAWL_STARTUP_ENABLED:false}
    cron: ${APP_CRAWL_CRON:-}
    http:
      connect-timeout-ms: ${APP_CRAWL_HTTP_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${APP_CRAWL_HTTP_READ_TIMEOUT_MS:15000}
      user-agent: ${APP_CRAWL_HTTP_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36}
      retry-max: ${APP_CRAWL_HTTP_RETRY_MAX:2}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
    issuer: ${JWT_ISSUER:football-verse-core}
    audience: ${JWT_AUDIENCE:football-verse-api}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  auth:
    public-url: ${APP_PUBLIC_URL:http://localhost:3000}
    rate-limit-secret: ${APP_AUTH_RATE_LIMIT_SECRET:${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}}
    trusted-proxies: ${APP_TRUSTED_PROXIES:}
    refresh-cookie:
      name: ${AUTH_REFRESH_COOKIE_NAME:football_verse_refresh}
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:None}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${MAIL_FROM:1footballverse@gmail.com}
    encryption-key: ${APP_MAIL_ENCRYPTION_KEY:}
    outbox-poll-ms: ${APP_MAIL_OUTBOX_POLL_MS:30000}
  prediction-service:
    url: ${PREDICTION_SERVICE_URL:http://127.0.0.1:8090}
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    channel-id: ${TELEGRAM_CHANNEL_ID:@footballverse_news}
    outbox-poll-ms: ${TELEGRAM_OUTBOX_POLL_MS:30000}
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.5-flash}
    daily-limit: ${AI_DAILY_LIMIT:100}

server:
  servlet:
    context-path: /api/v1
